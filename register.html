<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <meta name="description" content="Mozilla Firefox Registration Form">
    <meta name="keywords" content="Mozilla Firefox, Registration">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Evaluación Final de Programación Web I</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <header>
            <img src="banner.jpg" alt="Mozilla Firefox Banner">
        </header>

        <div class="main-content">

            <section class="content">

                <h2>Formulario de Registro</h2>

                <form id="registrationForm">

                    <fieldset>

                        <legend>Entrada de datos:</legend>

                        <div class="form-group">
                            <label for="name">Nombre</label>
                            <input type="text" id="name">
                        </div>

                        <div class="form-group">
                            <label for="ci">CI</label>
                            <input type="text" id="ci">
                        </div>

                        <div class="form-group">
                            <label for="password">Constraseña</label>
                            <input type="password" id="password">
                        </div>

                        <div class="form-group">
                            <label for="confirmPassword">Confirmación</label>
                            <input type="password" id="confirmPassword">


                        <displayflex>
                            <button type="submit">Enviar</button>

                            <button type="reset">Limpiar</button>
                        </displayflex>
                        </div>

                        <div id="messages"></div>

                    </fieldset>

                </form>

            </section>

            
            <aside class="sidebar">
                <nav>
                    <ul>
                        <li><a href="index.html"><u>Inicio</u></a></li>
                        <li><a href="register.html"><u>Formulario de registro</u></a></li>
                    </ul>
                </nav>
            </aside>

        </div>

        <footer>
            <p>
                Evaluación Final realizada por <span>Molefali Mary Lephoto</span>. Estándares web empleados: XHTML 1.0 Strict and CSS.
            </p>
        </footer>

    </div>

    <script src="script.js"></script>

</body>
</html>
